# Current reduce-levels-for-routing Spine evidence-oriented model.
#
# This config follows origin/reduce-levels-for-routing at 05584da:
# - production partitioned ratio-2 CSR
# - 11 binary levels, MAX_SORT_N=131072
# - destination partition = dst / VS_PARTITION_SIZE
# - 16 cold destination families + 16 hot destination shards
# - hot/cold classifier from measured destination in-degree
# - page CSR cursor page = 256 source vertices
# - selected exact-source split xclbin evidence ran at 134 MHz DATA

max_vertices: 16777216
vs_partition_size: 1048576
num_partitions: 16
hot_shards: 16
hot_cold_enabled: true
target_freq_mhz: 134
fifo_depth: 32
max_cycles: 20000000

edge_input_ii: 1
router_ii: 1
level0_accept_edges_per_cycle: 16

batch_size_edges: 131072
num_levels: 11
level_size_ratio: 2
carry_merge_edges_per_cycle: 16

hbm_channel_bytes: 536870912
hbm_latency_cycles: 200
hbm_read_bw_edges_per_cycle: 16
hbm_write_bw_edges_per_cycle: 16

csr_vertices_per_page: 256

readmaintenance_vertex_scan_rate: 64
tiny_active_threshold: 4096
sssp_pipeline_ii: 1
sssp_edges_per_cycle: 1
