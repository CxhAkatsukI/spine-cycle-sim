[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spine-cycle-sim"
version = "0.1.0"
description = "SST-style cycle-level simulator for the Spine dynamic graph accelerator"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["spine_cycle_sim*"]
