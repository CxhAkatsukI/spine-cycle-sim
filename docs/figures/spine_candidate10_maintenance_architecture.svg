<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Spine candidate-10 one-pass maintenance architecture</title>
  <desc id="desc">Execution-driven maintenance pipeline, HBM regions, split compute stream, and matching SST simulation components.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 28px sans-serif; fill: #111827; }
      .section { font: 700 18px sans-serif; fill: #111827; }
      .label { font: 600 14px sans-serif; fill: #111827; }
      .small { font: 12px sans-serif; fill: #374151; }
      .tiny { font: 11px sans-serif; fill: #374151; }
      .box { stroke: #475569; stroke-width: 1.5; rx: 6; ry: 6; }
      .flow { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="#f8fafc"/>
  <text x="54" y="46" class="title">Spine candidate-10: one-pass update maintenance and split compute</text>
  <text x="54" y="72" class="small">Frozen HLS source d98fb04c...7dbc | routed U55C xclbin 551ed1e8...666 | data clock 150 MHz</text>

  <rect x="45" y="100" width="1510" height="515" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="6"/>
  <text x="65" y="130" class="section">Read-maintenance CU, execution order</text>

  <rect class="box" x="70" y="165" width="165" height="82" fill="#dbeafe"/>
  <text x="152" y="194" text-anchor="middle" class="label">Preflight input</text>
  <text x="152" y="216" text-anchor="middle" class="small">HBM16, 16 B/edge</text>
  <text x="152" y="235" text-anchor="middle" class="small">AXIS FIFO depth 32</text>

  <rect class="box" x="275" y="165" width="185" height="82" fill="#dcfce7"/>
  <text x="367" y="191" text-anchor="middle" class="label">Classify + reduce</text>
  <text x="367" y="214" text-anchor="middle" class="small">blocks of up to 128</text>
  <text x="367" y="233" text-anchor="middle" class="small">metadata hot bitmap</text>

  <rect class="box" x="500" y="165" width="180" height="82" fill="#fef3c7"/>
  <text x="590" y="191" text-anchor="middle" class="label">Flush metadata</text>
  <text x="590" y="214" text-anchor="middle" class="small">family tags, 8/word</text>
  <text x="590" y="233" text-anchor="middle" class="small">source records</text>

  <rect class="box" x="720" y="165" width="135" height="82" fill="#f3e8ff"/>
  <text x="787" y="198" text-anchor="middle" class="label">Prefix</text>
  <text x="787" y="221" text-anchor="middle" class="small">32 families</text>

  <rect class="box" x="895" y="165" width="190" height="82" fill="#fee2e2"/>
  <text x="990" y="191" text-anchor="middle" class="label">Dispatch scan</text>
  <text x="990" y="214" text-anchor="middle" class="small">reread original edges</text>
  <text x="990" y="233" text-anchor="middle" class="small">write 32 bucket ranges</text>

  <rect class="box" x="1125" y="150" width="230" height="112" fill="#ccfbf1"/>
  <text x="1240" y="178" text-anchor="middle" class="label">Grouped publication</text>
  <text x="1240" y="200" text-anchor="middle" class="small">16 distinct packed words</text>
  <text x="1240" y="220" text-anchor="middle" class="small">directory, bitmap, scratch</text>
  <text x="1240" y="240" text-anchor="middle" class="small">append/preserve dirty list</text>

  <path class="flow" d="M235 206 H275"/>
  <path class="flow" d="M460 206 H500"/>
  <path class="flow" d="M680 206 H720"/>
  <path class="flow" d="M855 206 H895"/>
  <path class="flow" d="M1085 206 H1125"/>

  <rect class="box" x="305" y="320" width="225" height="92" fill="#e0f2fe"/>
  <text x="417" y="348" text-anchor="middle" class="label">Target selector</text>
  <text x="417" y="371" text-anchor="middle" class="small">level occupied + edge count</text>
  <text x="417" y="391" text-anchor="middle" class="small">cold and hot families</text>

  <rect class="box" x="585" y="305" width="245" height="122" fill="#ffedd5"/>
  <text x="707" y="335" text-anchor="middle" class="label">32 family writers</text>
  <text x="707" y="358" text-anchor="middle" class="small">L0: read dispatched bucket</text>
  <text x="707" y="379" text-anchor="middle" class="small">Carry: bucket + old levels</text>
  <text x="707" y="400" text-anchor="middle" class="small">count / row / mask / edge write</text>

  <rect class="box" x="885" y="320" width="210" height="92" fill="#e2e8f0"/>
  <text x="990" y="348" text-anchor="middle" class="label">Graph HBM[0..15]</text>
  <text x="990" y="371" text-anchor="middle" class="small">cold partitions + hot shards</text>
  <text x="990" y="391" text-anchor="middle" class="small">11 ratio-2 levels</text>

  <path class="flow" d="M1240 262 V285 H417 V320"/>
  <path class="flow" d="M530 366 H585"/>
  <path class="flow" d="M830 366 H885"/>

  <rect class="box" x="1135" y="320" width="200" height="92" fill="#dcfce7"/>
  <text x="1235" y="348" text-anchor="middle" class="label">Reader mode</text>
  <text x="1235" y="371" text-anchor="middle" class="small">active source/range discovery</text>
  <text x="1235" y="391" text-anchor="middle" class="small">edge_out AXIS depth 32</text>
  <path class="flow" d="M1095 366 H1135"/>

  <rect class="box" x="1380" y="320" width="145" height="92" fill="#fef3c7"/>
  <text x="1452" y="348" text-anchor="middle" class="label">Compute CU</text>
  <text x="1452" y="371" text-anchor="middle" class="small">Map / Reduce</text>
  <text x="1452" y="391" text-anchor="middle" class="small">value_out stream</text>
  <path class="flow" d="M1335 352 H1380"/>
  <path class="dash" d="M1380 396 H1350 V430 H1215 V412"/>

  <rect class="box" x="70" y="465" width="1365" height="112" fill="#f1f5f9"/>
  <text x="90" y="493" class="label">HBM16 persistent 134 MiB layout</text>
  <rect x="90" y="514" width="170" height="42" fill="#dbeafe" stroke="#64748b"/>
  <text x="175" y="540" text-anchor="middle" class="small">Input @ 0</text>
  <rect x="260" y="514" width="170" height="42" fill="#dcfce7" stroke="#64748b"/>
  <text x="345" y="540" text-anchor="middle" class="small">Bitmap @ 2 MiB</text>
  <rect x="430" y="514" width="250" height="42" fill="#fef3c7" stroke="#64748b"/>
  <text x="555" y="540" text-anchor="middle" class="small">Dirty list @ 4 MiB</text>
  <rect x="680" y="514" width="325" height="42" fill="#ccfbf1" stroke="#64748b"/>
  <text x="842" y="540" text-anchor="middle" class="small">Family directory @ 68 MiB</text>
  <rect x="1005" y="514" width="405" height="42" fill="#fee2e2" stroke="#64748b"/>
  <text x="1207" y="540" text-anchor="middle" class="small">32 dispatch buckets @ 132 MiB</text>

  <rect x="45" y="645" width="1510" height="335" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="6"/>
  <text x="65" y="677" class="section">Matching execution-driven simulator structure</text>

  <rect class="box" x="75" y="720" width="210" height="92" fill="#e2e8f0"/>
  <text x="180" y="749" text-anchor="middle" class="label">Two-phase scheduler</text>
  <text x="180" y="772" text-anchor="middle" class="small">evaluate, then commit</text>
  <text x="180" y="792" text-anchor="middle" class="small">one tick per core cycle</text>

  <rect class="box" x="345" y="705" width="235" height="122" fill="#dcfce7"/>
  <text x="462" y="734" text-anchor="middle" class="label">Candidate state machine</text>
  <text x="462" y="757" text-anchor="middle" class="small">same phases and boundaries</text>
  <text x="462" y="778" text-anchor="middle" class="small">payload validation</text>
  <text x="462" y="799" text-anchor="middle" class="small">exact component counters</text>

  <rect class="box" x="640" y="705" width="220" height="122" fill="#fef3c7"/>
  <text x="750" y="734" text-anchor="middle" class="label">FIFO + AXI masters</text>
  <text x="750" y="757" text-anchor="middle" class="small">capacity and backpressure</text>
  <text x="750" y="778" text-anchor="middle" class="small">burst/outstanding credits</text>
  <text x="750" y="799" text-anchor="middle" class="small">per-port ordering</text>

  <rect class="box" x="920" y="705" width="230" height="122" fill="#dbeafe"/>
  <text x="1035" y="734" text-anchor="middle" class="label">SST StandardMem</text>
  <text x="1035" y="757" text-anchor="middle" class="small">physical channel identity</text>
  <text x="1035" y="778" text-anchor="middle" class="small">request/response events</text>
  <text x="1035" y="799" text-anchor="middle" class="small">unbound access is fatal</text>

  <rect class="box" x="1210" y="705" width="260" height="122" fill="#ffedd5"/>
  <text x="1340" y="734" text-anchor="middle" class="label">DRAMSim3 HBM2</text>
  <text x="1340" y="757" text-anchor="middle" class="small">row/bank timing and contention</text>
  <text x="1340" y="778" text-anchor="middle" class="small">23 bound pseudo-channels</text>
  <text x="1340" y="799" text-anchor="middle" class="small">activity/energy statistics</text>

  <path class="flow" d="M285 766 H345"/>
  <path class="flow" d="M580 766 H640"/>
  <path class="flow" d="M860 766 H920"/>
  <path class="flow" d="M1150 766 H1210"/>

  <rect x="75" y="868" width="1395" height="75" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5" rx="6"/>
  <text x="95" y="896" class="label">Claim boundary</text>
  <text x="95" y="920" class="small">Control, addresses, payloads, queues and memory timing are execution-driven. Absolute candidate-10 latency remains structural until matched zero/one/edge/carry hardware holdouts calibrate fixed HLS and event-window cost.</text>
</svg>
